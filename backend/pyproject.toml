[project]
name = "chaudron"
version = "0.1.0"
# "Receipt import", not "receipt OCR": there is no OCR engine here, and saying so
# invited an operator to install one. A PDF recap is read as text (`pypdf`); a
# photograph is read by a vision model the household configures, or not at all.
description = "Household food stock management API with AI recipe suggestions and receipt import."
# No `readme` key on purpose: the repository README lives outside this build
# context, and referencing it would break the wheel build inside the container.
requires-python = ">=3.14"
# SPDX expression only: the LICENSE file lives at the repository root, outside
# this build context, so it cannot be referenced via `license-files`.
license = "AGPL-3.0-or-later"
authors = [{ name = "ClaraVnk" }]

# Runtime dependencies. Versions are pinned exactly; upgrades go through a
# reviewed change to this file plus a regenerated uv.lock.
dependencies = [
    "fastapi==0.141.1",
    # Transitive via fastapi, pinned here as a security floor: 0.52.1 carries
    # five known advisories (PYSEC-2026-161, -248, -249, -2280, -2281), the last
    # of which is fixed in 1.3.1. fastapi only asks for `starlette>=0.46.0`, so
    # nothing stops the resolver from picking a vulnerable build. Revisit when
    # fastapi raises its own floor past this one.
    "starlette==1.3.1",
    "uvicorn[standard]==0.52.1",
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.18.5",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",
    "anthropic==0.120.2",
    "python-multipart==0.0.32",
    # Text extraction from an uploaded shopping-list PDF (api contract 7.3).
    # BSD-3-Clause, no runtime dependency on Python 3.14, and -- the property
    # that decided it -- no network stack at all: `grep -E '^(import|from)
    # (urllib|requests|socket|http|ssl)' pypdf/` is empty, so a PDF referencing a
    # remote URL cannot make this process fetch it. See infra/documents/pdf.py.
    "pypdf==6.15.0",
    # AES-256-GCM for the household provider keys at rest (docs/data-model.md
    # section 9.2). The only cryptography this project performs itself, and the
    # reason it uses a maintained binding rather than an implementation of its
    # own: a hand-rolled AEAD is the classic way to lose the authentication tag.
    "cryptography==50.0.0",
    "argon2-cffi==25.1.0",
]

[project.urls]
Repository = "https://github.com/ClaraVnk/chaudron"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaudron"]

# ---------------------------------------------------------------------------
# Dependency groups (PEP 735) — installed by `uv sync`, excluded from the image.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "ruff==0.16.1",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    # Spins up a real PostgreSQL 16 container for integration tests.
    # SQLite is never used, not even in tests.
    "testcontainers[postgres]==4.15.0",
    # Test-only, and the reason they are here is that a CalDAV server verified
    # against its own assertions is verified against nothing. `caldav` is the
    # reference Python client (GPL-3.0, released 2026-05) and drives the real
    # discovery conversation -- well-known, principal, calendar-home-set,
    # calendar-query -- against the application. `icalendar` (BSD-2-Clause,
    # released 2026-07) re-parses what comes back, so the VTODO bytes are
    # checked by a parser this project did not write. Neither ships in the
    # runtime image: they are in the dev group, and `pyproject.toml`'s
    # `dependencies` list is untouched.
    "caldav==3.2.1",
    "icalendar==7.2.2",
]

# ---------------------------------------------------------------------------
# Ruff — linter and formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".venv", "migrations/versions"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez (no naive datetimes)
    "T20",  # flake8-print (no stray print/pprint)
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "PTH",  # flake8-use-pathlib
    "ASYNC",# flake8-async
    "S",    # flake8-bandit (security)
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",  # assert is legitimate in tests; see per-file ignores below
    "B008",  # FastAPI dependency injection relies on calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["chaudron"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# Mypy — strict typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

# `icalendar` and `caldav` are test-only, and both type a parsed property as a
# union of every iCalendar value type there is. Every access to `.dt` on a DUE
# therefore has to be narrowed against thirty alternatives, which would bury the
# assertion it belongs to. Skipping their imports makes them `Any` inside the
# tests: what those tests check is *behaviour of this application*, verified by a
# third-party parser, not the third party's own annotations.
[[tool.mypy.overrides]]
module = ["icalendar.*", "caldav.*"]
follow_imports = "skip"
follow_untyped_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=chaudron",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-branch",
]
markers = [
    "integration: test requires a live PostgreSQL instance",
    "contract: adapter conformance suite (ADR-0005); runs against doubles, no network",
    "live_provider: calls a real provider with real credentials; opt-in, never in PR CI",
]

[tool.coverage.run]
source = ["src/chaudron"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
