# =============================================================================
# JEU D'ÉVALUATION TENU À L'ÉCART
#
# Aucun de ces tickets n'a servi à construire le lexique. Le lexique et le code
# ont été gelés AVANT que ces trois photos ne soient lues et annotées, et n'ont
# pas été retouchés ensuite. Le protocole complet est dans docs/label-lexicon.md.
#
# Tickets (photos publiques Open Prices) :
#   openprices:10051  E.Leclerc Levallois — thermique, champs séparés par virgule
#   openprices:14722  Intermarché Contact — thermique, colonne de 20 caractères
#   openprices:3716   Carrefour Carré Sénart — hyper, colonne de 18 caractères
#
# `gold` = la lecture correcte de CHAQUE jeton que le module devrait toucher.
#   * une valeur ordinaire  → le jeton doit être développé ainsi
#   * "@brand"              → le jeton doit être reconnu comme marque et retiré
#   * un jeton absent de `gold` doit être laissé tel quel ; le développer compte
#     comme fausse expansion, l'erreur que ce module existe pour éviter.
#
# Annoter honnêtement veut dire inscrire aussi ce que le lexique ne sait PAS
# lire : ces entrées comptent en rappel manqué et donnent sa valeur au chiffre.
# =============================================================================

