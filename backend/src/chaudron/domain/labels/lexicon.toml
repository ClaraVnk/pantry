# =============================================================================
# Chaudron — lexique d'expansion des abréviations d'étiquettes de caisse (FR)
#
# CE FICHIER EST DE LA DONNÉE, PAS DU CODE. Il se modifie sans savoir programmer.
# La procédure d'enrichissement est décrite dans docs/label-lexicon.md.
#
# Une entrée = une forme abrégée + ses lectures possibles + d'où elle vient.
#
#   form        la forme telle qu'imprimée (la casse et les accents sont ignorés)
#   expansions  TOUTES les lectures plausibles. Deux lectures = ambiguïté réelle,
#               et l'ambiguïté doit remonter : ne jamais en supprimer une pour
#               « faire propre ».
#   confidence  high   : forme lue sur un vrai ticket ET lecture imposée par la ligne
#               medium : forme lue sur un vrai ticket, lecture déduite du contexte
#               low    : plausible, non vérifié — traité comme « je ne sais pas »
#   kind        truncation | skeleton | initialism | qualifier | packaging
#               | brand | private_label | department
#   evidence    OÙ la forme a été vue. « assumed » = aucune preuve, à supprimer en
#               premier si un mauvais appariement est signalé.
#   retailers   enseignes concernées ; vide = toutes. Une entrée d'enseigne est
#               ignorée quand l'enseigne du ticket est inconnue.
#
# Les preuves `openprices:NNNNN` renvoient à une photo de ticket publique :
# https://prices.openfoodfacts.org/api/v1/proofs/NNNNN
#
#   openprices:23005   Intermarché Contact  (2024)
#   openprices:8932    Super U              (2024-09-19)
#   openprices:111936  Carrefour Market     (2026-05-09)
#   openprices:60947   E.Leclerc            (2025-12-17, ticket dématérialisé)
#   openprices:60984   Auchan               (2025-12-17)
#   openprices:16595   Monoprix
#   openprices:122557  U Express
#   openprices:19960   Lidl                 (casse mixte, accents conservés)
#
# RÈGLE : on n'inscrit ici que ce qui DIFFÈRE de la forme française courante.
# `BIO`, `UHT`, `AOP`, `IGP`, `VRAC` s'écrivent pareil dans Open Food Facts : les
# développer n'aiderait pas l'appariement et allongerait le lexique pour rien.
# =============================================================================

[meta]
version = "2026-08-04"
language = "fr"


