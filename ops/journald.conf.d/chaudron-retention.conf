# Chaudron — journal retention.
#
# Install to:  /etc/systemd/journald.conf.d/chaudron-retention.conf   (as root)
# Apply with:  sudo systemctl restart systemd-journald
# Verify:      journalctl --disk-usage
#              sudo journalctl --header | grep -i 'retention\|max'
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
# ---------------------------------------------------------------------------
# Podman's default log driver is journald, and no quadlet in this deployment
# used to say otherwise — so container output was already being persisted to
# disk, indefinitely, by default. That is a data-retention decision nobody made.
#
# It matters here specifically because of what used to be in those lines. The
# API's uvicorn access log carried a GTIN in the query string, a calendar feed
# identifier in the path, and a `household_id` on every line. Two consequences
# followed:
#
#   * A `household_id` stayed correlatable in the journal AFTER an erasure
#     exercised under article 17 GDPR, because the erasure acts on the database
#     and the journal is a different sink that nothing points at.
#   * The retention period was "until the disk fills", which is not a period.
#
# The first half is fixed at the source: the API runs with `--no-access-log`
# and the proxy's log is filtered (ops/Caddyfile.example). This file fixes the
# second half, and is the backstop for whatever the filters miss.
#
# ---------------------------------------------------------------------------
# THE NUMBERS
# ---------------------------------------------------------------------------
# 30 days is the ceiling, chosen as the shortest window that still covers a
# monthly billing dispute over LLM spend and an incident noticed a few weeks
# late. Shorten it rather than lengthen it: nothing in this deployment needs a
# log line from six weeks ago, and every line kept is a line that has to be
# accounted for in an erasure request.
#
# NOTE — this is a SYSTEM-WIDE setting. It applies to every service on the host,
# not only Chaudron's. Check what else runs here before installing it; if
# something needs a longer history, give that service its own sink rather than
# raising this.

[Journal]
Storage=persistent
Compress=yes

# The hard bound on retention. Entries older than this are removed on the next
# rotation regardless of how much disk is free — which is the property that
# makes "how long do we keep logs?" answerable.
MaxRetentionSec=30day

# Rotate at least monthly so MaxRetentionSec has a boundary to act on: retention
# is enforced by discarding whole rotated files, so a journal that never rotates
# never expires anything.
MaxFileSec=1week

# Disk ceilings, in case volume rather than age is what fills the partition.
SystemMaxUse=2G
SystemKeepFree=1G
SystemMaxFileSize=128M

# Rate limiting. A request loop that logs on every iteration must not be able to
# push a week of history out of the journal in ten minutes — which is how an
# incident erases its own evidence.
RateLimitIntervalSec=30s
RateLimitBurst=10000

# Do not forward to syslog, wall or the console: a second sink is a second place
# the same identifiers land, with its own retention that nobody configured.
ForwardToSyslog=no
ForwardToWall=no
ForwardToConsole=no
