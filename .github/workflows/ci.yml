# Third-party actions are pinned to a full commit SHA, with the release they
# correspond to in a trailing comment. A `vN` tag is a moving pointer that the
# upstream owner can repoint at will; a SHA is the artefact itself. Bump these
# by hand, deliberately, and read the diff — nothing renews them automatically.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default, and every job below is content with that. `publish.yml`
# is the only workflow holding `packages: write`, and it never runs pull-request
# code — see the guard at the top of its `publish` job.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  UV_VERSION: "0.9.7"
  # Determinism comes from the explicit `--locked` on every sync and export
  # below. Do NOT add UV_FROZEN here: `--locked` and `--frozen` are mutually
  # exclusive, and setting the variable globally makes every one of those
  # commands fail with exit code 2. `--locked` is the stricter of the two — it
  # asserts the lockfile is current, where `--frozen` merely skips re-locking.

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint + format check (verification only, never auto-fix in CI)
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend / lint + format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github .

      - name: Format check (ruff format --check)
        run: uv run ruff format --check --diff .

  # ---------------------------------------------------------------------------
  # 2. Static typing
  # ---------------------------------------------------------------------------
  backend-typecheck:
    name: Backend / mypy
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Type check
        run: uv run mypy

  # ---------------------------------------------------------------------------
  # 3. Tests against a real PostgreSQL 16 — never SQLite
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend / pytest (PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: backend-typecheck
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chaudron
          POSTGRES_PASSWORD: chaudron
          POSTGRES_DB: chaudron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chaudron -d chaudron_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test credentials only: this database exists for the length of the job.
      CHAUDRON_ENV: ci
      CHAUDRON_LOG_LEVEL: WARNING
      CHAUDRON_DATABASE_URL: postgresql+asyncpg://chaudron:chaudron@localhost:5432/chaudron_test
      CHAUDRON_SECRET_KEY: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 4. OCI image build and vulnerability scan — Podman only, never Docker
  # ---------------------------------------------------------------------------
  # The scan lives in this job rather than in one of its own so that there is
  # exactly one build. A separate job would have to rebuild the image — minutes
  # of runner time, and an artefact that is not bit-for-bit the one this job
  # blessed — or ship it across as an upload. What is scanned here is the image
  # that was just built, and nothing else.
  backend-build:
    name: Backend / build + scan image (podman)
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Show podman version
        run: podman version

      - name: Build image
        run: |
          podman build \
            --format docker \
            --file backend/Containerfile \
            --tag "localhost/chaudron-api:${GITHUB_SHA::12}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            backend

      - name: Inspect image
        run: podman image inspect "localhost/chaudron-api:${GITHUB_SHA::12}" --format '{{ .Id }} {{ .Config.User }}'

      # Installed the way gitleaks is, and for the same reason: a pinned
      # release, downloaded to disk, checked against a pinned sha256 before
      # anything is extracted. A GitHub release asset can be replaced by its
      # owner without the tag moving, and verifying against the release's own
      # checksums.txt would not help — that file is replaceable by the same hand.
      #
      # To bump: download the new archive, compare its sha256 against
      # trivy_<version>_checksums.txt, and paste both values here in the same
      # commit. Nothing renews this automatically.
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.72.0"
          TRIVY_SHA256: "bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"
        run: |
          set -euo pipefail
          ARCHIVE="$(mktemp -d)/trivy.tar.gz"
          curl -sSfL -o "$ARCHIVE" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${ARCHIVE}" | sha256sum --check --strict -
          tar -xzf "$ARCHIVE" -C /usr/local/bin trivy
          trivy --version

      # The vulnerability database unpacks to well over a gigabyte and is pulled
      # from a registry that rate-limits anonymous clients, so a run that refetches
      # it every time is both slow and the first thing to flake. Keyed by the
      # day: fetched once, reused by every run that follows it, and never older
      # than that — a scanner reading a week-old database reports last week's
      # truth and says nothing about it.
      - name: Key the Trivy database cache by day
        id: trivy-db-day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache the Trivy vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.trivy-db-day.outputs.day }}
          restore-keys: trivy-db-

      # Trivy's `image` mode reaches for a Docker or containerd daemon, and
      # there is deliberately none here. `--input` reads an archive instead, so
      # no step below assumes a daemon exists. `--format docker-archive` matches
      # the `--format docker` the image was built with above.
      - name: Export the image as an archive Trivy can read
        run: podman save --format docker-archive -o /tmp/chaudron-api.tar "localhost/chaudron-api:${GITHUB_SHA::12}"

      # Reported, never enforced: everything HIGH and above, fixable or not, in
      # the log and in the job summary. This half cannot fail, which is what
      # lets the findings nobody can act on today still be visible tomorrow
      # instead of being silenced along with the gate.
      - name: Report image vulnerabilities (HIGH and CRITICAL, including unfixed)
        run: |
          set -euo pipefail
          trivy image --input /tmp/chaudron-api.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --format table \
            --output trivy-report.txt
          {
            echo "### Image vulnerabilities — HIGH and CRITICAL"
            echo
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat trivy-report.txt

      # THE GATE, AND WHY IT IS SET WHERE IT IS
      # -------------------------------------------------------------------------
      # It blocks on a CRITICAL that has a published fix, and on nothing else.
      # Two failure modes were weighed against each other:
      #
      #   * a gate on every severity fails on the first unfixable advisory in
      #     the base image and gets switched off inside a week — which is how a
      #     scan ends up reporting nothing while the badge stays green;
      #   * a gate on nothing is decoration.
      #
      # `--ignore-unfixed` is what makes *actionable* the criterion rather than
      # *severe*, and it is not a formality here: measured on this image, the
      # bookworm layer carries 6 CRITICAL and 18 HIGH advisories that Debian has
      # published no fix for. A gate that counted those would be red on the day
      # it merged, for something no commit in this repository can change. Same
      # reasoning as `npm audit --audit-level=high` in the frontend job.
      #
      # **HIGH is a gate too, and it became one the moment it could be.** The
      # first version of this step stopped at CRITICAL, for a measured reason:
      # the only HIGH findings with a published fix were msgpack and setuptools,
      # neither installed by `uv.lock`, both vendored inside the pip that
      # `python:3.14-slim-bookworm` ships, in code the runtime stage never
      # imports. The note left here said to drop pip and tighten in the same
      # commit. `backend/Containerfile` now removes that directory, and the count
      # was re-measured against a same-day database rather than assumed:
      #
      #     fixable CRITICAL,HIGH before: 2   (msgpack 1.1.2, setuptools 70.3.0)
      #     fixable CRITICAL,HIGH after:  0
      #
      # So the gate costs nothing today and catches the next fixable HIGH in a
      # dependency this repository actually ships. The unfixable bookworm
      # advisories — 6 CRITICAL, 18 HIGH — are still excluded by
      # `--ignore-unfixed`, and still cannot be closed from here.
      #
      # If this ever goes red on something unfixable, the answer is to move the
      # base image forward, not to widen the exclusion.
      #
      # `--skip-db-update` reuses the database the step above just downloaded.
      # `--scanners vuln` only: secrets in the repository are gitleaks' job, and
      # the two scanners disagreeing about the same file helps nobody.
      - name: Fail the build on a fixable CRITICAL or HIGH
        run: |
          trivy image --input /tmp/chaudron-api.tar \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --skip-db-update \
            --exit-code 1 \
            --quiet

  # ---------------------------------------------------------------------------
  # 4b. Ops — the proxy configuration is code, and it carries the header posture
  # ---------------------------------------------------------------------------
  # `ops/Caddyfile.example` holds every security header on the frontend origin,
  # the CSP for both documents, the request-body cap and the log filter. It had
  # no check of any kind: a typo landed on `main` and was discovered by a site
  # that would not start, or — worse and more likely — by a header that silently
  # stopped being emitted.
  #
  # `caddy validate` catches structural errors, unknown directives, snippets
  # imported before they are defined, and bad matcher syntax. It does NOT catch
  # a header that is merely wrong, which is what §7.4's browser check is for.
  #
  # Environment variables are supplied with placeholder values because the
  # adapter resolves `{$VAR}` at load time and an unset one becomes an empty
  # string — which validates, and would let a genuinely broken interpolation
  # through.
  ops-caddyfile:
    name: Ops / validate Caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Pinned to the same major version chaudron-proxy.container runs, so this
      # validates against the adapter that will actually parse the file. Bump
      # both together.
      - name: Validate ops/Caddyfile.example
        env:
          CHAUDRON_SITE_HOST: chaudron.ci.invalid
          CHAUDRON_ACME_EMAIL: ci@chaudron.ci.invalid
          CHAUDRON_API_UPSTREAM: chaudron:8000
        run: |
          set -euo pipefail
          podman run --rm \
            -e CHAUDRON_SITE_HOST -e CHAUDRON_ACME_EMAIL -e CHAUDRON_API_UPSTREAM \
            -v "${PWD}/ops/Caddyfile.example:/etc/caddy/Caddyfile:ro" \
            docker.io/library/caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      # A structurally valid file that lost a header is the failure mode this
      # job exists for, and `validate` cannot see it. Assert the directives that
      # must survive any edit, against the adapted JSON rather than the source
      # text — so that a header moved into a block where it no longer applies
      # still fails.
      - name: Assert the security headers survive adaptation
        env:
          CHAUDRON_SITE_HOST: chaudron.ci.invalid
          CHAUDRON_ACME_EMAIL: ci@chaudron.ci.invalid
          CHAUDRON_API_UPSTREAM: chaudron:8000
        run: |
          set -euo pipefail
          podman run --rm \
            -e CHAUDRON_SITE_HOST -e CHAUDRON_ACME_EMAIL -e CHAUDRON_API_UPSTREAM \
            -v "${PWD}/ops/Caddyfile.example:/etc/caddy/Caddyfile:ro" \
            docker.io/library/caddy:2-alpine \
            caddy adapt --config /etc/caddy/Caddyfile > adapted.json

          fail=0
          for needle in \
            Strict-Transport-Security \
            X-Content-Type-Options \
            Referrer-Policy \
            X-Frame-Options \
            Permissions-Policy \
            Cross-Origin-Opener-Policy \
            Cross-Origin-Resource-Policy \
            Reporting-Endpoints \
            Content-Security-Policy \
            X-Real-IP \
            Forwarded
          do
            if ! grep -q -- "$needle" adapted.json; then
              echo "::error title=Missing directive::'${needle}' is not in the adapted configuration."
              fail=1
            fi
          done
          exit "$fail"

  # ---------------------------------------------------------------------------
  # 5. Security — dependency vulnerabilities and leaked secrets
  # ---------------------------------------------------------------------------
  security-deps:
    name: Security / dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Export locked runtime dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file requirements.ci.txt

      - name: Audit dependencies
        run: uvx --from pip-audit==2.9.0 pip-audit --requirement requirements.ci.txt --strict --progress-spinner off

  security-secrets:
    name: Security / secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # Full history so gitleaks can scan every commit, not just the tip.
          fetch-depth: 0

      # gitleaks is invoked directly rather than through gitleaks-action@v2.
      # The action derives a commit range of the form `<base>^..<head>` and
      # hands it to `git log`; on a repository's first push, `<base>` is the
      # root commit and `<base>^` does not exist, so the scan aborts with exit
      # code 1 — reported as a leak, while the log says "no leaks found".
      # A red badge that means "the tool broke" is worse than no badge.
      # The archive is downloaded to disk and checked against a pinned digest
      # before anything is extracted. Piping straight into `tar` executed
      # whatever the release URL happened to serve, and a GitHub release asset
      # can be replaced by its owner without the tag changing. Verifying against
      # the release's own checksums.txt would not help — that file is replaceable
      # by the same hand.
      #
      # To bump: download the new archive, compare its sha256 against
      # gitleaks_<version>_checksums.txt, and paste it here in the same commit.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          set -euo pipefail
          ARCHIVE="$(mktemp -d)/gitleaks.tar.gz"
          curl -sSfL -o "$ARCHIVE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${ARCHIVE}" | sha256sum --check --strict -
          tar -xzf "$ARCHIVE" -C /usr/local/bin gitleaks
          gitleaks version

      # Two passes: the whole history, then the working tree. The second catches
      # anything staged but not yet committed in a pull request build.
      - name: Scan git history
        run: gitleaks git . --redact --verbose --exit-code 1

      - name: Scan working tree
        run: gitleaks dir . --redact --verbose --exit-code 1

  # ---------------------------------------------------------------------------
  # 6. Frontend — lint, dependency audit and build.
  # Every step stays guarded on the presence of frontend/package.json so the job
  # degrades to a no-op rather than a red badge if the directory ever goes away.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend / audit + lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Frontend inactive::frontend/package.json not found; skipping lint and build."
          fi

      - name: Set up Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      # The backend has `pip-audit --strict`; the frontend had nothing. Set to
      # `high` rather than `low` so the build blocks on what is actionable and
      # is not turned off the first week by a transitive advisory nobody can fix.
      - name: Audit dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint

      # Checked, never rewritten — the same rule the backend's `ruff format
      # --check` follows. A CI job that reformats and pushes turns every review
      # into a diff against a machine.
      #
      # This step was missing while `lint` and `build` were both here, and the
      # gap was not theoretical: a badly formatted `globIgnores` in
      # `vite.config.ts` reached the tree through it, and was only found when
      # somebody ran the check by hand. ESLint and Prettier do not overlap here —
      # one is about what the code does, the other about how it is set out — so
      # passing `lint` says nothing about this.
      - name: Check formatting
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run format:check

      # `VITE_SITE_URL` is mandatory for a build (vite.config.ts fails without
      # it), because a `dist/` carrying the fallback domain in `canonical`,
      # `og:url` and `Sitemap:` is a deployment that hands its search ranking to
      # somebody else's domain. CI is not publishing anything, so it supplies an
      # RFC 2606 `.invalid` host: enough to satisfy the check, impossible to
      # mistake for a real deployment if it ever escapes.
      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        env:
          VITE_SITE_URL: https://chaudron.ci.invalid
        run: npm run build

      # The service worker's registration scope is not the manifest's `scope`,
      # and the two were silently different for a while — see
      # docs/public-page-and-indexing.md. Assert the built artefact, not the
      # config that is supposed to produce it.
      - name: Assert the service worker is scoped to /app/
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          set -euo pipefail
          if ! grep -q "scope: '/app/'" dist/registerSW.js; then
            echo "::error title=Service worker scope::dist/registerSW.js does not register with scope '/app/'. The public landing page would be served from a cache the application controls."
            cat dist/registerSW.js
            exit 1
          fi
          echo "registerSW.js scope: /app/ — ok"
